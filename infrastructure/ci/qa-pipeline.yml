# ─────────────────────────────────────────────────────────────────────────────
# Using QAgentic *inside your own* CI pipeline.
#
# Copy into the QA automation repository you want the agents to work on.
# Two useful modes:
#   1. nightly self-healing  — repair locator drift before the team sees red
#   2. PR standards gate     — fail the build on QA coding-standard violations
#
# Autonomy is explicit and bounded: --yes only in the healing job, which opens a
# PR for review rather than pushing to a protected branch.
# ─────────────────────────────────────────────────────────────────────────────
name: QAgentic

on:
  schedule:
    - cron: "17 2 * * 1-5"      # weekday nights, off the hour
  pull_request:
    paths: ["tests/**", "e2e/**", "playwright.config.*"]
  workflow_dispatch:
    inputs:
      instruction:
        description: "What should the QAgentic automate?"
        required: false
        type: string
      mode:
        description: "Autonomy level"
        default: generate
        type: choice
        options: [plan_only, generate, full, autonomous, heal_only]

env:
  AIQA_URL: ${{ vars.AIQA_URL }}
  AIQA_API_KEY: ${{ secrets.AIQA_API_KEY }}
  AIQA_PROJECT_ID: ${{ vars.AIQA_PROJECT_ID }}

jobs:
  standards-gate:
    name: QA standards gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the suite against the organization QA standards
        run: |
          response=$(curl -sS -X POST \
            -H "X-API-Key: $AIQA_API_KEY" -H "Content-Type: application/json" \
            "$AIQA_URL/api/projects/$AIQA_PROJECT_ID/lint")
          echo "$response" | python -m json.tool

          errors=$(echo "$response" | python -c "import sys,json;print(json.load(sys.stdin)['errors'])")
          echo "### QAgentic standards" >> "$GITHUB_STEP_SUMMARY"
          echo "$response" | python -c "
import sys, json
report = json.load(sys.stdin)
print(f\"{report['files_checked']} files, {report['errors']} error(s), {report['warnings']} warning(s)\")
print()
for violation in report['violations'][:40]:
    print(f\"- \`{violation['rule_id']}\` {violation['file_path']}:{violation['line']} — {violation['message']}\")
" >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "::error::$errors QA standards violation(s) — see the job summary"
            exit 1
          fi

  nightly-heal:
    name: Nightly self-heal
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm }
      - run: npm ci && npx playwright install --with-deps chromium

      - name: Diagnose and repair failing tests
        id: heal
        run: |
          run_id=$(curl -sS -X POST \
            -H "X-API-Key: $AIQA_API_KEY" -H "Content-Type: application/json" \
            -d "{\"project_id\":\"$AIQA_PROJECT_ID\",\"instruction\":\"Nightly: diagnose and repair failing tests\",\"mode\":\"heal_only\",\"auto_approve\":true}" \
            "$AIQA_URL/api/runs" | python -c "import sys,json;print(json.load(sys.stdin)['id'])")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

          # Poll until the run reaches a terminal state.
          for _ in $(seq 1 120); do
            status=$(curl -sS -H "X-API-Key: $AIQA_API_KEY" "$AIQA_URL/api/runs/$run_id" \
              | python -c "import sys,json;print(json.load(sys.stdin)['status'])")
            echo "status: $status"
            case "$status" in
              succeeded|failed|cancelled|budget_exceeded) break ;;
            esac
            sleep 15
          done

          curl -sS -H "X-API-Key: $AIQA_API_KEY" "$AIQA_URL/api/runs/$run_id/report?format=markdown" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request with the repairs
        uses: peter-evans/create-pull-request@v6
        with:
          branch: aiqa/nightly-heal-${{ github.run_number }}
          title: "test: automated locator/timing repairs"
          body: |
            Generated by QAgentic (run `${{ steps.heal.outputs.run_id }}`).

            Every change was verified by re-running the affected tests; repairs that
            did not fix the failure were reverted automatically. Suspected **product
            defects are never auto-repaired** — check the run report for any raised.
          labels: ai-qa, tests
          delete-branch: true

  automate:
    name: Automate a feature
    if: github.event_name == 'workflow_dispatch' && inputs.instruction != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate automation
        run: |
          curl -sS -X POST \
            -H "X-API-Key: $AIQA_API_KEY" -H "Content-Type: application/json" \
            -d "$(python -c "
import json, os
print(json.dumps({
  'project_id': os.environ['AIQA_PROJECT_ID'],
  'instruction': '''${{ inputs.instruction }}''',
  'mode': '${{ inputs.mode }}',
  'auto_approve': True,
}))")" \
            "$AIQA_URL/api/runs" | python -m json.tool
