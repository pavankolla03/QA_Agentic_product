# ─────────────────────────────────────────────────────────────────────────────
# CI for the QAgentic platform itself.
# Copy to .github/workflows/ci.yml to enable.
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The suite runs entirely offline: no provider keys, no network, deterministic.
  AIQA_ENV: test
  AIQA_SECRET_KEY: ci-secret
  AIQA_BOOTSTRAP_API_KEY: aiqa_ci_key_0123456789abcdef

jobs:
  backend:
    name: Backend (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest-cov

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy packages services agents tools --ignore-missing-imports
        continue-on-error: true      # advisory until the codebase is fully annotated

      - name: Test
        run: pytest tests -q --cov=packages --cov=services --cov=agents --cov=tools --cov-report=xml

      - name: End-to-end self-check
        run: python -m scripts.selfcheck

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml

  extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - working-directory: apps/vscode-extension
        run: npm ci

      - name: Compile
        working-directory: apps/vscode-extension
        run: npm run compile

      - name: Package
        working-directory: apps/vscode-extension
        run: |
          npm install -g @vscode/vsce
          vsce package --no-dependencies --out qagentic.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: apps/vscode-extension/qagentic.vsix

  postgres:
    name: Postgres compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aiqa
          POSTGRES_PASSWORD: aiqa
          POSTGRES_DB: aiqa
        options: >-
          --health-cmd "pg_isready -U aiqa"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: |
          pip install -r requirements.txt "psycopg[binary]>=3.1"
      - name: Schema + smoke on Postgres
        env:
          AIQA_DATABASE_URL: postgresql+psycopg://aiqa:aiqa@localhost:5432/aiqa
        run: |
          python -c "from services.observability.db import init_db; init_db(); print('schema created on postgres')"
          python -m scripts.selfcheck

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          push: false
          tags: aiqa/control-plane:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
