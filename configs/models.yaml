# ─────────────────────────────────────────────────────────────────────────────
# Model Routing Policy — free models only.
#
# Every model below costs nothing. No paid provider appears in any tier, so a
# misconfiguration cannot silently start spending: there is nothing to spend.
#
# The four tiers still exist, because "free" does not mean "interchangeable".
# A 120B model and a 2.6B model are both free and are not remotely the same
# thing, so the tiers now rank by *capability* rather than by price:
#
#   reasoning  strongest free models  — requirement analysis, test design,
#                                       root-cause analysis, self-healing
#   coding     code-capable models    — TypeScript/Playwright/POM generation
#   cheap      fastest free models    — summarisation, classification,
#                                       metadata, report prose
#   embedding  local hashing          — no free embedding API exists, and a
#                                       deterministic local embedder beats none
#
# A fifth tier, `none`, is implicit and is still the most important: anything
# deterministic (file IO, git, npm, tsc, eslint, parsing, cost maths) never
# reaches this file at all.
#
# ── How these models were chosen ────────────────────────────────────────────
# Not from their names. `python -m scripts.qualify_models` sends every free
# model on OpenRouter the two requests this platform actually makes — a
# structured-output request and a code-planning request — and reports which
# return parseable JSON. Only models that passed are listed here.
#
# The free catalogue churns constantly: models appear, become paid and get
# retired, and every model in the previous version of this file had stopped
# being free. When runs start failing for no obvious reason, re-run that script
# and update this file. These entries were qualified on 2026-09-13.
# ─────────────────────────────────────────────────────────────────────────────
version: 3

defaults:
  # Refuse to select any model with a non-zero price, whatever a tier lists.
  # This is enforced in the router, so adding a paid model to a route below
  # cannot start spending by accident — it will simply never be chosen.
  free_only: true
  temperature: 0.1
  max_tokens: 4096
  # Free models are markedly slower than paid ones. A timeout here is a failed
  # run, not a cheaper one, so this is generous.
  timeout_seconds: 300
  retries: 2
  prompt_caching: true
  cache_min_chars: 2000

# ── Tier definitions ────────────────────────────────────────────────────────
# Ordered: the router tries each in turn and falls through on failure. The
# fallback chain matters more than usual here, because any free model can be
# rate limited at any moment.
routes:
  reasoning:
    - { provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free",             in: 0, out: 0 }
    - { provider: openrouter, model: "nex-agi/nex-n2.5-pro:free",                          in: 0, out: 0 }
    - { provider: openrouter, model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", in: 0, out: 0 }
    - { provider: openrouter, model: "nex-agi/nex-n2.5-mini:free",                         in: 0, out: 0 }
    - { provider: openrouter, model: "inclusionai/ling-3.0-flash-vl:free",                 in: 0, out: 0 }
    - { provider: ollama,     model: "qwen2.5-coder:7b",                                   in: 0, out: 0 }
    - { provider: mock,       model: "mock-reasoning",                                     in: 0, out: 0 }

  # `north-mini-code` is code-specialised and passed the code-planning probe;
  # the 120B general model sits behind it as the strongest all-rounder.
  coding:
    - { provider: openrouter, model: "cohere/north-mini-code:free",                        in: 0, out: 0 }
    - { provider: openrouter, model: "nvidia/nemotron-3-super-120b-a12b:free",             in: 0, out: 0 }
    - { provider: openrouter, model: "nex-agi/nex-n2.5-mini:free",                         in: 0, out: 0 }
    - { provider: openrouter, model: "inclusionai/ling-3.0-flash-vl:free",                 in: 0, out: 0 }
    - { provider: ollama,     model: "qwen2.5-coder:7b",                                   in: 0, out: 0 }
    - { provider: mock,       model: "mock-coding",                                        in: 0, out: 0 }

  # Ordered by measured latency, fastest first: these calls are frequent, so
  # seconds compound across a run.
  cheap:
    - { provider: openrouter, model: "inclusionai/ling-3.0-flash-vl:free",                 in: 0, out: 0 }
    - { provider: openrouter, model: "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", in: 0, out: 0 }
    - { provider: openrouter, model: "nex-agi/nex-n2.5-mini:free",                         in: 0, out: 0 }
    - { provider: openrouter, model: "liquid/lfm-2.5-2.6b:free",                           in: 0, out: 0 }
    - { provider: openrouter, model: "openrouter/free",                                    in: 0, out: 0 }
    - { provider: ollama,     model: "qwen2.5-coder:7b",                                   in: 0, out: 0 }
    - { provider: mock,       model: "mock-cheap",                                         in: 0, out: 0 }

  # OpenRouter has no free embedding endpoint. The local hashing embedder is
  # deterministic and costs nothing; retrieval quality is lower than a real
  # embedding model, which is a deliberate trade rather than an oversight.
  embedding:
    - { provider: ollama,     model: "nomic-embed-text",                                   in: 0, out: 0, dim: 768 }
    - { provider: hashing,    model: "local-hash-512",                                     in: 0, out: 0, dim: 512 }

aliases:
  fast: cheap

# ── Which tier each agent gets by default ───────────────────────────────────
agent_capability:
  orchestrator:      cheap
  requirement:       reasoning
  repository:        cheap        # structure comes from parsers, not the model
  exploration:       cheap        # the browser does the work; the model picks targets
  test_design:       reasoning
  code_generation:   coding
  standards:         cheap        # static analysis first
  execution:         cheap        # deterministic; almost never calls a model
  failure_analysis:  reasoning
  self_healing:      reasoning
  reporting:         cheap

# ── Task-level overrides ────────────────────────────────────────────────────
task_capability:
  requirement.analyze:            reasoning
  requirement.classify:           cheap
  repository.summarize:           cheap
  exploration.pick_targets:       cheap
  exploration.workflows:          cheap
  test_design.plan:               reasoning
  test_design.batch:              reasoning
  test_design.dedupe:             cheap
  code_generation.plan:           coding   # one call: page objects + step bindings
  code_generation.page_objects:   coding   # legacy, kept for older runs
  code_generation.steps:          coding
  code_generation.fixtures:       coding
  standards.semantic:             cheap
  standards.parse_freeform:       cheap
  failure_analysis.classify:      reasoning
  failure_analysis.triage_bulk:   cheap
  self_healing.propose:           reasoning
  reporting.summarize:            cheap

# ── Escalation ──────────────────────────────────────────────────────────────
# Escalating costs nothing now, but it is still bounded: the reasoning models
# are slower and more heavily rate limited, so sending trivial work to them
# burns the daily allowance instead of money.
escalation:
  enabled: true
  cheap_to_reasoning_threshold: 0.75
  escalate_on_retry: true
  max_escalations_per_run: 3

# ── Provider request budgets ────────────────────────────────────────────────
# The free tier is request-limited, and the limit is PER KEY. Two keys are two
# allowances: the provider rotates when one is exhausted (see
# packages/llm_provider/keyring.py), so this ceiling is per key.
provider_limits:
  openrouter:
    free_requests_daily: 1000
    # Stop using a key slightly before it is empty, so rotation happens between
    # requests rather than in the middle of one.
    reserve_threshold: 25
  ollama:
    concurrent_requests: 2

# ── Default per-run budget ──────────────────────────────────────────────────
run_budget:
  max_requests: 60
  max_input_tokens: 600000
  max_output_tokens: 200000
  # 0 disables the cost ceiling, which is correct here only because
  # `free_only: true` above already makes a paid call impossible. The ceiling
  # is the wrong tool for this job: it triggers on spend that has already
  # happened, whereas free_only prevents the call.
  max_cost_usd: 0.0
  max_retries: 2
  max_correction_attempts: 3
  max_healing_attempts: 2
  max_execution_retries: 3

# ── Reuse policy ────────────────────────────────────────────────────────────
# Still worth having with free models: the scarce resource is now the daily
# request allowance rather than dollars.
reuse:
  skip_design: true
  skip_design_similarity: 0.80
  skip_design_coverage: 1.0
  min_remembered_scenarios: 3

# ── Measured cost baseline ──────────────────────────────────────────────────
# Reference point supplied by the user: ~30,000 credits for 110 test cases.
baseline:
  credits_total: 30000
  test_cases: 110
  credits_per_test: 273
  target_reduction_initial: 0.50
  target_reduction_mature: 0.80
