# ─────────────────────────────────────────────────────────────────────────────
# Model Routing Policy
# Maps logical "capabilities" to concrete provider/model pairs, with fallbacks.
# The router picks the first entry whose provider is configured & healthy.
# Cost is USD per 1M tokens. Free/local models are cost 0.
# ─────────────────────────────────────────────────────────────────────────────
version: 1

defaults:
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 180
  retries: 2

# Capability -> ordered candidate list (first healthy wins)
routes:
  # Cheap, fast, high-volume: classification, summarisation, routing decisions
  fast:
    - { provider: ollama,     model: "qwen2.5-coder:7b",                    in: 0,    out: 0 }
    - { provider: openrouter, model: "deepseek/deepseek-chat-v3-0324:free", in: 0,    out: 0 }
    - { provider: openai,     model: "gpt-4o-mini",                         in: 0.15, out: 0.60 }
    - { provider: gemini,     model: "gemini-2.0-flash",                    in: 0.10, out: 0.40 }
    - { provider: mock,       model: "mock-fast",                           in: 0,    out: 0 }

  # Deep reasoning: test design, failure root-cause, self-healing decisions
  reasoning:
    - { provider: anthropic,  model: "claude-sonnet-5",                     in: 3.00, out: 15.00 }
    - { provider: openrouter, model: "deepseek/deepseek-r1:free",           in: 0,    out: 0 }
    - { provider: ollama,     model: "qwen2.5-coder:14b",                   in: 0,    out: 0 }
    - { provider: openai,     model: "gpt-4o",                              in: 2.50, out: 10.00 }
    - { provider: mock,       model: "mock-reasoning",                      in: 0,    out: 0 }

  # Code generation: page objects, steps, fixtures
  coding:
    - { provider: anthropic,  model: "claude-sonnet-5",                     in: 3.00, out: 15.00 }
    - { provider: ollama,     model: "qwen2.5-coder:7b",                    in: 0,    out: 0 }
    - { provider: openrouter, model: "qwen/qwen-2.5-coder-32b-instruct:free", in: 0,  out: 0 }
    - { provider: openai,     model: "gpt-4o",                              in: 2.50, out: 10.00 }
    - { provider: mock,       model: "mock-coding",                         in: 0,    out: 0 }

  # Embeddings for repository knowledge
  embedding:
    - { provider: ollama,     model: "nomic-embed-text",                    in: 0,    out: 0, dim: 768 }
    - { provider: openai,     model: "text-embedding-3-small",              in: 0.02, out: 0, dim: 1536 }
    - { provider: hashing,    model: "local-hash-512",                      in: 0,    out: 0, dim: 512 }

# Per-agent capability preference
agent_capability:
  orchestrator:      fast
  requirement:       reasoning
  repository:        fast
  exploration:       fast
  test_design:       reasoning
  code_generation:   coding
  standards:         fast
  execution:         fast
  failure_analysis:  reasoning
  self_healing:      reasoning
  reporting:         fast
